<style>
:root{
  --bg:#101524;--bg2:#171e36;--surf:#1b2342;--line:#2a3560;--tx:#eaedf7;--mut:#939cba;
  --allin:#ff6161;--poke:#9a8aff;--ftb:#ffb547;--good:#4fd69c;--bad:#ff7a7a;--eq:#9fb0d6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f1f3fa;--bg2:#e6eaf6;--surf:#fff;--line:#cbd3ea;--tx:#161c33;--mut:#586089;
  --allin:#d93a3a;--poke:#6a58e6;--ftb:#c97d0a;--good:#12945f;--bad:#c93a3a;--eq:#53659a;color-scheme:light;}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--tx);
  font:400 15px/1.45 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.app{height:100%;max-width:1040px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
h1{font-size:clamp(18px,3.2vw,26px);font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px}
.lbl{color:var(--mut);font-size:12px;margin-bottom:6px}
.enemy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eb{padding:11px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);font-weight:600;font-size:14px;
  transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.eb:active{transform:scale(.96)}
.eb[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent);background:color-mix(in srgb,var(--c) 16%,var(--surf))}
.eb i{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--mut);margin-top:1px}
.champs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);transition:box-shadow .3s,transform .3s}
.col h2{font-size:12px;font-weight:600;color:var(--c);text-align:center}
.col.hint{box-shadow:0 0 0 2px var(--c),0 0 22px color-mix(in srgb,var(--c) 45%,transparent);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--c),0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}}
.cb{border-radius:10px;padding:9px 4px;background:var(--surf);border:1.5px solid transparent;text-align:center;line-height:1.2;transition:transform .18s,border-color .18s,background .18s}
.cb:active{transform:scale(.95)}
.cb b{display:block;font-size:14px;font-weight:600}
.cb small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.cb[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surf));transform:translateY(-2px)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:12px;align-items:stretch}
svg{width:100%;height:100%;min-height:0;display:block}
.arrow{color:var(--line);transition:color .3s,opacity .3s;opacity:.7}
.arrow line{stroke:currentColor;stroke-width:2;stroke-linecap:round}
.arrow polygon{fill:currentColor}
.arrow.on{opacity:1;color:var(--c)}
.arrow.on line{stroke-width:3;stroke-dasharray:6 6;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.node circle{fill:var(--surf);stroke:var(--line);stroke-width:2;transition:stroke .3s,fill .3s}
.node text{fill:var(--tx);font-size:11px;font-weight:600;text-anchor:middle}
.node.me circle{stroke:var(--c);fill:color-mix(in srgb,var(--c) 28%,var(--surf))}
.node.foe circle{stroke:var(--c);stroke-dasharray:4 3}
.node.me.foe circle{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:4}}
.tip{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0;overflow:hidden}
.tip .in{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);margin-bottom:6px}
.tip h3{font-size:clamp(14px,1.9vw,17px);font-weight:600;margin-bottom:4px}
.tip p{font-size:clamp(14px,1.9vw,17px);line-height:1.5}
.tip .empty{color:var(--mut)}

const SHORT_SUP=["Alistar","Braum","Leona","Nautilus","Pyke","Rakan","Rell","Taric","Thresh"];

const SQUISHY=["Sona","Soraka","Yuumi","Nami","Milio","Renata Glasc"];
const SEC=[
  {id:"nilah",n:"Nilah",a:"allin",secret:true,trig:L=>!!(L.adc&&L.sup&&L.adc[2]<=1&&SHORT_SUP.includes(L.sup[0])),b:.5,w:{allin:.1,poke:-.7,ftb:.05},cw:.2,sf:.4,mo:.6,e:.55},
  {id:"swain",n:"Swain",a:"ftb",secret:true,trig:L=>!!(L.adc&&SHORT_ADC.includes(L.adc[0])&&!(L.sup&&L.sup[1]==="poke")),b:.6,w:{allin:.15,poke:-.6,ftb:0},cw:.3,sf:.5,mo:.2,e:.6},
  {id:"velkoz",n:"Vel’Koz",a:"poke",secret:true,trig:L=>!!(L.adc&&IMMOBILE.includes(L.adc[0])&&!(L.sup&&L.sup[1]==="allin")),b:.45,w:{allin:-.45,poke:.1,ftb:.3},cw:.3,sf:.5,mo:.15,e:.55},
  {id:"lux",n:"Lux",a:"poke",secret:true,trig:L=>!!(L.sup&&SQUISHY.includes(L.sup[0])&&(!L.adc||L.adc[2]<=2)),b:.4,w:{allin:-.3,poke:-.1,ftb:.25},cw:.3,sf:.45,mo:.3,e:.55}
];
SEC.forEach(x=>{const t=x.trig;x.trig=L=>t(L)||(()=>{const d=secOf(x,L);return !!d&&d[0]>=53&&d[1]>=400})()});
const SECBY=id=>SEC.find(x=>x.id===id);
function sscore(x,L){
  const mh=cl(x.b+x.w.allin*L.V.allin+x.w.poke*L.V.poke+x.w.ftb*L.V.ftb+(L.er<=1?.15:0)-L.cc*x.cw,-1,1)*.6,rd=secOf(x,L),m=blend(mh,rd,L);
  const safety=cl(x.sf-L.cc*(1.3-x.mo)+.15*m,0,1),profit=cl(x.e+.2*m,0,1);
  return {rd,m,safety,profit,opt:cl(.5*(m+1)/2+.3*safety+.2*profit,0,1)};
}
function secretRow(L,R){
  const t=SEC.filter(x=>x.trig(L));
  if(!t.length)return "";
  const x=t.reduce((a,b)=>R[b.id].opt>R[a.id].opt?b:a);
  return S.rv?`<button class="rb secret" data-id="${x.id}" style="--c:var(--sec)"><b>${x.n}</b><small>Pick secret</small><em>${Math.round(R[x.id].opt*100)}</em></button>`
   :`<button class="rb secret" data-id="secret" style="--c:var(--sec)"><b>Pick secret</b><small>Touche pour révéler</small><em>?</em></button>`;
}

/* Calcul : style de la lane en face, puis scores de chaque champion */
function lane(){
  const adc=S.adc?ADC.find(x=>x[0]===S.adc):null,sup=S.sup?SUP.find(x=>x[0]===S.sup):null;
  const one=k=>({allin:+(k==="allin"),poke:+(k==="poke"),ftb:+(k==="ftb")});
  let V;
  if(adc&&sup){V={allin:0,poke:0,ftb:0};V[adc[1]]+=.45;V[sup[1]]+=.55}
  else if(adc)V=one(adc[1]);else if(sup)V=one(sup[1]);else if(S.e)V=one(S.e);else return null;
  const dom=Object.keys(V).sort((a,b)=>V[b]-V[a])[0];
  const er=adc?adc[2]:{allin:1,poke:3,ftb:2}[dom];
  const cc=(sup?sup[2]*.12:{allin:.2,poke:.1,ftb:.05}[dom])+(adc?adc[3]*.05:0);
  return {V,dom,er,cc,adc,sup};
}

/* Winrate des picks secrets contre ces 4 ADC (déduit des pages de l’ADC adverse) */
const SECWR={
nilah:{tristana:[51.29,1045],kaisa:[56.07,1951],jinx:[49.21,1386],caitlyn:[52.59,1217]},
swain:{tristana:[46.82,613],kaisa:[56.36,1187],jinx:[52.01,871],caitlyn:[54.8,1084]},

};
const blend=(mh,rd,L)=>{if(!rd)return mh;const w=Math.min(1,rd[1]/1500)*(L.sup?.7:1);return cl(w*cl((rd[0]-50)/4,-1,1)+(1-w)*mh,-1,1)};
const realOf=(id,L)=>L.adc&&REAL[id]?REAL[id][norm(L.adc[0])]||null:null;
const secOf=(x,L)=>L.adc&&SECWR[x.id]?SECWR[x.id][norm(L.adc[0])]||null:null;
const src=(r,L)=>r.rd?`<p class="src">Winrate réel : ${r.rd[0].toFixed(1).replace(".",",")} % contre ${L.adc[0]} (${r.rd[1].toLocaleString("fr-FR")} parties, Lolalytics Gold)</p>`:L.adc?`<p class="src">Matchup estimé : pas de données réelles pour ce duel.</p>`:"";
function score(c,L){
  const M=Object.keys(A).reduce((t,k)=>t+L.V[k]*(c.a===k?0:beats(c.a,k)?1:-1),0);
  const mh=cl(M+cl(c.rng-L.er,-3,2)*.2,-1,1)*.6,rd=realOf(c.id,L),m=blend(mh,rd,L);
  const safety=cl(c.sf-L.cc*(1.3-c.m)+.15*m,0,1);
  const profit=cl(c.e+.2*m+.1*L.V.ftb*c.push,0,1);
  return {rd,m,safety,profit,opt:cl(.5*(m+1)/2+.3*safety+.2*profit,0,1)};
}
const bar=(n,x,c)=>`<div class="bar"><span>${n}</span><span class="t"><i style="--w:${x}%;--c:${c}"></i></span><span>${x}</span></div>`;

function render(){
  const L=lane();
  const tsec=L?SEC.filter(x=>x.trig(L)):[],RS={};tsec.forEach(x=>RS[x.id]=sscore(x,L));
  if(S.c&&SECBY(S.c)&&!tsec.some(x=>x.id===S.c))S.c=null;
  const me=S.c?(SECBY(S.c)||C.find(c=>c.id===S.c)):null,mk=me?me.a:null;
  const dom=L?L.dom:null,counter=dom?Object.keys(A).find(k=>beats(k,dom)):null;
  const R={};if(L)C.forEach(c=>R[c.id]=score(c,L));
  Object.assign(R,RS);
  const top=k=>L?C.reduce((a,b)=>R[b.id][k]>R[a.id][k]?b:a).id:null;
  const tg={opt:top("opt"),safety:top("safety"),profit:top("profit")};
  document.querySelectorAll(".eb").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===dom));
  document.querySelectorAll(".pk").forEach(b=>{const n=S[b.dataset.w];b.querySelector("b").textContent=n||"Ajouter";b.classList.toggle("set",!!n)});
  document.querySelectorAll(".cb").forEach(b=>{
    const id=b.dataset.id,c=C.find(x=>x.id===id),t=[];
    if(L){if(tg.opt===id)t.push("★ Optimal");if(tg.safety===id)t.push("Safe");if(tg.profit===id)t.push("Rentable")}
    b.querySelector("small").textContent=t.length?t.join(" "):(c.r==="Principal"?"":(c.note||c.r));
    b.querySelector(".sc").textContent=L?Math.round(R[id].opt*100):"";
    b.classList.toggle("top",!!L&&tg.opt===id);
    b.setAttribute("aria-pressed",id===S.c);
  });
  document.querySelectorAll(".arrow").forEach(g=>{
    let on=false,col=null;const f=g.dataset.f,t=g.dataset.t;
    if(mk&&dom){if((f===mk&&t===dom)||(f===dom&&t===mk)){on=true;col=A[f].c}}
    else if(dom&&!mk){if(t===dom){on=true;col=A[f].c}}
    g.classList.toggle("on",on);if(col)g.style.setProperty("--c",col);
  });
  document.querySelectorAll(".node").forEach(n=>{
    const k=n.dataset.k;
    n.classList.toggle("me",k===mk||(!mk&&k===counter));
    n.classList.toggle("foe",k===dom);
  });
  let html,v=null;
  if(L){
    const desc=L.adc&&L.sup?`${L.adc[0]} + ${L.sup[0]}`:L.adc?L.adc[0]:L.sup?L.sup[0]:`un style ${A[L.dom].n.toLowerCase()}`;
    if(me){
      const r=R[me.id];
      v=r.m>=.3?"good":r.m<=-.2?"bad":"eq";
      const Lb={good:["Avantage","var(--good)"],bad:["Désavantage","var(--bad)"],eq:["Match équilibré","var(--eq)"]}[v];
      const mix=L.adc&&L.sup&&L.adc[1]!==L.sup[1]?`<p class="note">Duo mixte : ADC ${A[L.adc[1]].n.toLowerCase()}, support ${A[L.sup[1]].n.toLowerCase()}.</p>`:"";
      const c=me.secret?"var(--sec)":A[me.a].c;
      html=`<span class="pill" style="--c:${Lb[1]}">${Lb[0]}</span><h3>${me.n} contre ${desc}</h3>${mix}<p>${W(T[me.id][L.dom])}</p>`+
        `<div class="bars">${bar("Matchup",Math.round((r.m+1)*50),c)}${bar("Sécurité",Math.round(r.safety*100),c)}${bar("Rentabilité",Math.round(r.profit*100),c)}</div>`+src(r,L);
    }else{
      const labels={};
      [["opt","Optimal"],["safety","Safe"],["profit","Rentable"]].forEach(([k,l])=>{const id=tg[k];(labels[id]=labels[id]||[]).push(l)});
      html=`<span class="pill" style="--c:${A[counter].c}">Reco contre ${desc}</span><div class="reco">`+
        Object.entries(labels).map(([id,ls])=>{const c=C.find(x=>x.id===id);
          return `<button class="rb" data-id="${id}" style="--c:${A[c.a].c}"><b>${c.n}</b><small>${ls.join(", ")}</small><em>${Math.round(R[id].opt*100)}</em></button>`}).join("")+secretRow(L,R)+`</div>`;
    }
  }else if(me){
    html=`<h3>${me.n}</h3><p class="empty">Ajoute l’ADC ou le support en face, ou choisis un style, pour voir quoi faire.</p>`;
  }else{
    html=`<p class="empty">Ajoute l’ADC ou le support en face, ou choisis un style. L’app calcule le pick optimal, le plus safe et le plus rentable.</p>`;
  }
  $("#tip").innerHTML=`<div class="in">${html}</div>`;
  return v;
}

/* Fenêtre de choix (un seul niveau) */
let kind=null;
function closeSheet(){$("#sheet").classList.remove("open")}
function openSheet(k){
  kind=k;const list=k==="adc"?ADC:SUP;
  $("#stitle").textContent=k==="adc"?"ADC adverse":"Support adverse";
  $("#chips").innerHTML=list.map((x,i)=>`<button class="chip" style="--c:${A[x[1]].c};--i:${i}" data-n="${x[0]}" data-s="${norm(x[0])}">${x[0]}</button>`).join("");
  $("#srm").hidden=!S[k];$("#q").value="";
  $("#sheet").classList.add("open");
  if(matchMedia("(hover:hover)").matches)$("#q").focus();
}
$(".pks").addEventListener("click",e=>{const b=e.target.closest(".pk");if(b)openSheet(b.dataset.w)});
$("#q").addEventListener("input",e=>{const q=norm(e.target.value);document.querySelectorAll(".chip").forEach(c=>c.hidden=!c.dataset.s.includes(q))});
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  S[kind]=b.dataset.n;S.e=null;S.rv=false;closeSheet();
  const v=render();fx(v,e.clientX,e.clientY,b.style.getPropertyValue("--c"));
});
$("#srm").addEventListener("click",()=>{S[kind]=null;S.rv=false;closeSheet();render()});
$("#sclose").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

$("#enemy").addEventListener("click",e=>{
  const b=e.target.closest(".eb");if(!b)return;
  const k=b.dataset.k,same=!S.adc&&!S.sup&&S.e===k;
  S.adc=S.sup=null;S.rv=false;S.e=same?null:k;
  const v=render();if(S.e)fx(v,e.clientX,e.clientY,A[k].c);
});
$("#champs").addEventListener("click",e=>{
  const b=e.target.closest(".cb");if(!b)return;
  S.c=S.c===b.dataset.id?null:b.dataset.id;
  const v=render();if(S.c)fx(v,e.clientX,e.clientY,A[C.find(c=>c.id===S.c).a].c);
});
$("#tip").addEventListener("click",e=>{
  const b=e.target.closest(".rb");if(!b)return;
  if(b.dataset.id==="secret"){S.rv=true;render();burst(e.clientX,e.clientY,"var(--sec)",26);return}
  S.c=b.dataset.id;const v=render();fx(v,e.clientX,e.clientY,b.style.getPropertyValue("--c"));
});
render();
